<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Fundo Gradiente Espacial -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Nebulosa -->
    <radialGradient id="nebula" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente do Planeta -->
    <linearGradient id="planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gradientes Padrão para os Anéis -->
    <linearGradient id="ring-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    
    <linearGradient id="ring-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Cauda do Cometa -->
    <linearGradient id="comet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow/Brilho -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Giro do anel.
       O anel NAO gira como helice: a elipse fica parada, com a inclinacao
       dela, e o que anda e o tracejado ao longo da curva. E o que da a
       impressao de material orbitando o planeta.

       Cada deslocamento vai ate a SOMA do stroke-dasharray daquele traco,
       para o ciclo emendar sem salto:
         180+30+90+20 = 320    120+40+60+30 = 250
         160+20+80+10 = 270    100+30+50+20 = 200

       Frente e fundo correm em sentidos opostos na tela, porque sao as duas
       metades do mesmo anel: quando a da frente vai para a direita, a de tras
       esta indo para a esquerda. */
    @keyframes anelTras1  { to { stroke-dashoffset:  320; } }
    @keyframes anelTras2  { to { stroke-dashoffset:  250; } }
    @keyframes anelFrente1 { to { stroke-dashoffset: -270; } }
    @keyframes anelFrente2 { to { stroke-dashoffset: -200; } }

    @keyframes shootingStar {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      15% { opacity: 1; }
      35% { transform: translate(-450px, 250px) scale(0.8); opacity: 0; }
      100% { transform: translate(-450px, 250px) scale(0); opacity: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    .star-s1 { animation: twinkle 3s infinite ease-in-out; transform-origin: center; }
    .star-s2 { animation: twinkle 4s infinite ease-in-out 1.2s; transform-origin: center; }
    .star-s3 { animation: twinkle 2.5s infinite ease-in-out 0.6s; transform-origin: center; }

    .planet-system { animation: float 6s infinite ease-in-out; }
    
    .anel-tras-1   { animation: anelTras1   14s infinite linear; }
    .anel-tras-2   { animation: anelTras2   14s infinite linear; }
    .anel-frente-1 { animation: anelFrente1 14s infinite linear; }
    .anel-frente-2 { animation: anelFrente2 14s infinite linear; }

    .comet { animation: shootingStar 6s infinite ease-out 2s; }

    /* Tem gente que passa mal com animacao na tela. */
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .nebula-bg { animation: pulseGlow 8s infinite ease-in-out; transform-origin: 520px 140px; }
  </style>

  <!-- Fundo do Espaço -->
  <rect width="800" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="800" height="400" fill="url(#nebula)" class="nebula-bg" rx="16" />

  <!-- Estrelas -->
  <g fill="#ffffff">
    <circle cx="100" cy="80" r="1.5" class="star-s1" />
    <circle cx="250" cy="50" r="1" class="star-s2" />
    <circle cx="380" cy="90" r="2" class="star-s3" />
    <circle cx="620" cy="60" r="1.5" class="star-s1" />
    <circle cx="720" cy="110" r="1" class="star-s2" />
    <circle cx="80" cy="280" r="2" class="star-s2" />
    <circle cx="220" cy="340" r="1.5" class="star-s3" />
    <circle cx="650" cy="310" r="1" class="star-s1" />
    <circle cx="740" cy="270" r="2" class="star-s3" />
  </g>

  <!-- Estrelas em Cruz -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.8">
    <path d="M180,140 L180,150 M175,145 L185,145" class="star-s2" />
    <path d="M580,220 L580,232 M574,226 L586,226" class="star-s1" />
    <path d="M680,80 L680,90 M675,85 L685,85" class="star-s3" />
  </g>

  <!-- Cometa -->
  <g class="comet" transform="translate(750, -20)">
    <path d="M0,0 L120,-60 L20,-20 Z" fill="url(#comet-grad)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Sistema do Planeta Principal -->
  <g class="planet-system">
    
    <!-- Anel Traseiro: a elipse fica parada, o tracejado e que corre -->
    <g transform="rotate(-18 400 200)">
      <ellipse class="anel-tras-1" cx="400" cy="200" rx="155" ry="38" fill="none" stroke="url(#ring-grad-1)" stroke-width="10" stroke-dasharray="180 30 90 20" opacity="0.6" />
      <ellipse class="anel-tras-2" cx="400" cy="200" rx="135" ry="32" fill="none" stroke="url(#ring-grad-2)" stroke-width="4" stroke-dasharray="120 40 60 30" opacity="0.5" />
    </g>

    <!-- Corpo do Planeta -->
    <circle cx="400" cy="200" r="75" fill="url(#planet-grad)" filter="url(#glow)" />

    <!-- Detalhes da Atmosfera -->
    <path d="M330,185 Q400,210 470,185" fill="none" stroke="#f472b6" stroke-width="3" opacity="0.3" />
    <path d="M326,205 Q400,230 474,205" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />

    <!-- Anel Frontal (passa na frente do planeta e da a profundidade) -->
    <g transform="rotate(-18 400 200)">
      <path class="anel-frente-1" d="M245,200 A155 38 0 0 0 555,200" fill="none" stroke="url(#ring-grad-1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="160 20 80 10" />
      <path class="anel-frente-2" d="M265,200 A135 32 0 0 0 535,200" fill="none" stroke="url(#ring-grad-2)" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 30 50 20" />
    </g>

  </g>

  <!-- Moldura Minimalista -->
  <rect x="2" y="2" width="796" height="396" rx="14" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>